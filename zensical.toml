[project]
site_name = "bgbng"
site_description = "Parallel dev environments on git worktrees"
site_author = "gouz"
site_url = "https://gouz.github.io/bgbng/"
copyright = """
Copyright &copy; 2026 gouz
"""
repo_url = "https://github.com/gouz/bgbng"
repo_name = "gouz/bgbng"
nav = [
    "index.md",
    { Tutorials = ["tutorials/first-environments.md"] },
    { "How-to Guides" = [
        "how-to/encrypt-secrets.md",
        "how-to/team-access.md",
        "how-to/docker-compose.md"
    ]},
    { Explanation = ["explanation/how-it-works.md"] },
    { Reference = [
        "reference/cli.md",
        "reference/config.md"
    ]}
]

[project.theme]
variant = "modern"
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.expand",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-orange"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-orange"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/gouz/bgbng"
